<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Машины{% endblock %}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 30px 15px;
            color: #1e293b;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #0f172a;
            margin-top: 0;
        }
        .hint-box {
            background-color: #eff6ff;
            border-left: 4px solid #3b82f6;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 25px;
            font-size: 14px;
            line-height: 1.5;
        }
        .card {
            border: 1px solid #e2e8f0;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            transition: transform 0.15s ease;
        }
        .card:hover {
            transform: translateY(-2px);
            border-color: #cbd5e1;
        }
        .card-title {
            margin: 0 0 8px 0;
            font-size: 18px;
        }
        .card-desc {
            color: #475569;
            margin: 0 0 15px 0;
            font-size: 14px;
        }
        .card-meta {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .btn {
            display: inline-block;
            background-color: #2563eb;
            color: #ffffff;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
        .btn-back {
            background-color: #64748b;
        }
        .btn-back:hover {
            background-color: #475569;
        }
        code {
            background-color: #f8fafc;
            color: #d946ef;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
